# ساختهٔ PackageBuilder — دست‌نویس ویرایش نکن
# محتوایش از تصمیم‌های ثبت‌شده در project.config.json ساخته می‌شود.
#
# «name» دامنهٔ Docker را تعیین می‌کند، نه مسیرِ پوشه. اگر دو کپی از این
# پروژه نامِ یکسان داشته باشند، وضعیتِ هم را نشان می‌دهند — پس این نام
# باید یکتا بماند.
name: 27-taminlibrary

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: app
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  redis_data:
  postgres_data:
